[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-kite"
version = "1.1.0"
description = "Python interface for KITE: a real-space quantum transport simulator based on the Chebyshev/Kernel Polynomial Method"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.9,<3.13"
# Floors, not pins, and they must match environment.yml: `pip install -e .` is
# the last step of every documented install route, so these are the only bounds
# the non-conda routes get.
dependencies = [
    "numpy >=1.20",
    "scipy >=1.6",        # scipy.integrate.simpson, which replaced simps
    "h5py >=3.0",
    "matplotlib >=3.4",
]

[project.optional-dependencies]
pybinding = ["pybinding"]

[project.urls]
Homepage = "https://quantum-kite.com"
Documentation = "https://quantum-kite.github.io/kite-v2"
Repository = "https://github.com/quantum-kite/kite-v2"

[tool.hatch.build.targets.wheel]
packages = ["python/kite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite's own files are named for what they pin rather than with a test_
# prefix, so the default pattern would collect none of them.
python_files = ["test_*.py", "*_regression.py", "*_sweep.py"]
