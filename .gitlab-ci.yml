# Build the documentation on GitLab and publish on GitLab pages

image: python:latest
pages:
  stage: deploy
  only:
    - docs
  script:
    - pip install mkdocs-material
    # --strict for the same reason as the GitHub workflow: without it mkdocs
    # prints a warning for a broken link and exits 0, and this job publishes.
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public