# CI: build the docs site, and build+smoke-test KITE itself across OSes.
name: ci
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  # Two tracked paths differing only by case collapse into one on macOS and
  # Windows, which makes the repository impossible to clone intact. A Src/ and
  # src/ pair did exactly that. The runner here is Linux and case-sensitive, so
  # it is the one machine that would never notice on its own -- hence an
  # explicit check. No dependencies and no build: it reads the git index.
  check-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.x
      - run: python tests/case_collision_regression.py

  # Runs on every push and PR (unlike deploy-docs below, which only runs on
  # push to master): a strict build turns any broken internal link, missing
  # nav target, or other mkdocs warning into a CI failure, catching link rot
  # before it reaches the deployed site.
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.x
      - run: pip install "mkdocs-material==9.7.6"
      - run: mkdocs build --strict

  # Gated on check-docs: `mkdocs gh-deploy` does not take --strict, so without
  # this the two jobs race on a push to master and a site that failed the
  # strict build is published anyway -- which would make the strict check
  # advisory rather than a gate.
  deploy-docs:
    needs: check-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.x
      - run: pip install "mkdocs-material==9.7.6"
      - run: mkdocs gh-deploy --force

  # Windows is not in this matrix: a native (non-Docker) MSVC build needs real
  # portability work (M_PI, and/or/not word-operators, an OpenMP signed-index
  # requirement, an Eigen::Map overload gap) that's
  # been deliberately deprioritized in favor of Docker, which already runs
  # unmodified on Windows via Docker Desktop's WSL2 backend.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: kite
          miniforge-version: latest

      - name: Debug — list conda env's fftw/hdf5 install
        shell: bash -el {0}
        run: |
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          ls "$CONDA_PREFIX/lib" | grep -i "fftw\|hdf5" || echo "(no matching libs found)"

      - name: Install kite (editable)
        shell: bash -el {0}
        run: pip install -e .

      - name: Configure (CMake)
        shell: bash -el {0}
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=Release ..

      - name: Build KITEx + KITE-tools
        shell: bash -el {0}
        run: cmake --build build --config Release -j 4

      # The whole pipeline, end to end, on the cheapest example there is: the
      # Python API writes an HDF5 configuration, KITEx reads it and computes,
      # and KITE-tools post-processes the result into a .dat. That is the gate
      # — it answers "do the three pieces still talk to each other", which is
      # the failure nothing else here would catch.
      #
      # It is deliberately NOT the full example sweep. Running every shipped
      # example takes about 93 minutes, two production-scale ones accounting
      # for most of it, which is far too slow to sit in front of a push. The
      # sweep stays a manual check (tests/run_all_examples.py); this stays
      # small enough that it always runs.
      - name: Smoke test — Python to KITEx to KITE-tools
        shell: bash -el {0}
        run: |
          cd examples
          python dos_graphene.py
          ../build/KITEx graphene_lattice-output.h5
          ../build/KITE-tools graphene_lattice-output.h5
          test -s dos.dat || { echo "KITE-tools produced no dos.dat"; exit 1; }
          echo "pipeline ok: $(wc -l < dos.dat) rows in dos.dat"

      # The regression scripts that check KITE-tools against a real KITEx run
      # need stored output to compare with. All of these are cheap (seconds),
      # so the fixtures are generated here rather than leaving those scripts to
      # run nowhere, as they did while they were excluded for not being
      # self-contained.
      - name: Generate the fixtures the KITE-tools regressions compare against
        shell: bash -el {0}
        run: |
          (cd examples
           python kane_mele_spin_hall.py
           ../build/KITEx kane_mele_spin_hall-output.h5)
          (cd tests/fixtures
           python graphene_custom_two_xx_check.py
           ../../build/KITEx graphene_custom_two_xx_check-output.h5
           python graphene_singleshot_check.py
           ../../build/KITEx graphene_singleshot_check-output.h5
           python square_arpes_and_dos_check.py
           ../../build/KITEx square_arpes_and_dos_check-output.h5)

      # One entry point for the whole suite. Collection patterns and the
      # sys.path pinning that keeps `import kite` on this checkout live in
      # pyproject.toml and tests/conftest.py, so this runs the same tests a
      # developer gets from a bare `pytest`.
      - name: Test suite
        shell: bash -el {0}
        run: pytest tests/ -q

      # NOTE: tests/start_tests.sh is not run here yet. Most of its cases need
      # the optional `pybinding` extra to regenerate configs, and at least one
      # case (tests/test001_KITEx_sq) fails independently of this workflow --
      # its checked-in configORIG.h5 fixture predates a C++ change that now
      # requires /Seed0 and /Seed1 fields. Fixing the test suite itself is
      # separate, follow-up work.

  # Every shipped example, end to end: python example.py -> KITEx -> KITE-tools,
  # with the output scanned for non-finite values. The static half of the sweep
  # (each example's declared spectrum_range against the spectrum its own lattice
  # produces) needs no execution and rides along in the test suite above; this
  # job is the behavioural half, which does.
  #
  # It is slow -- roughly 40 minutes of compute for the 50 scripts, most of it in
  # three long examples -- so it runs as its own job rather than inside
  # build-and-test, and supersedes itself when a newer commit arrives on the same
  # ref. A check nobody remembers to run is how a diverged example survived in the
  # first place, so it runs on every push rather than nightly.
  example-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: example-sweep-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v2

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: kite
          miniforge-version: latest

      - name: Install kite (editable)
        shell: bash -el {0}
        run: pip install -e .

      - name: Build KITEx + KITE-tools
        shell: bash -el {0}
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release -j 4

      - name: Run every example end to end
        shell: bash -el {0}
        run: python tests/run_all_examples.py --outdir sweep-data

      # The report says which stage failed and how long each took, which the job
      # log alone does not make easy to read. Uploaded on failure too -- that is
      # when it is worth having.
      - name: Upload the sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-sweep-report
          path: sweep-data/sweep-report.json
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker image (includes its own baked-in smoke test)
        run: docker build -t quantum-kite/kite-v2:ci .

  # Follows docs/installation.md section 2.2's Homebrew recipe verbatim (as
  # verbatim as a non-interactive CI shell allows), on a real macOS runner
  # that ships with Homebrew preinstalled -- an actual end-to-end check of
  # that documented path, not just the conda one already covered above.
  build-and-test-homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install an up-to-date C++ compiler via Homebrew
        run: |
          brew install gcc
          GCC_VERSION=$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)
          echo "GCC_VERSION=$GCC_VERSION" >> "$GITHUB_ENV"

      - name: Install HDF5 from source, enforcing C++17 (matches docs section 2.2)
        run: |
          HOMEBREW_CC=gcc-$GCC_VERSION HOMEBREW_CXX=g++-$GCC_VERSION HOMEBREW_CXXFLAGS="-std=c++17" brew install hdf5 --build-from-source

      - name: Install CMake, Python, and FFTW3
        run: brew install python cmake git fftw

      - name: Install kite (editable) with the Homebrew python
        run: |
          # Modern Homebrew Python is "externally managed" (PEP 668) -- a bare
          # `pip install` is refused to protect Homebrew's own Python-dependent
          # formulae. A venv is the standard, recommended way around this (not
          # a workaround specific to CI): --break-system-packages would also
          # "fix" this but risks corrupting the Homebrew-managed interpreter.
          "$(brew --prefix)/bin/python3" -m venv .venv
          echo "PYTHON_BIN=$(pwd)/.venv/bin/python3" >> "$GITHUB_ENV"
          "$(pwd)/.venv/bin/python3" -m pip install -e .

      - name: Configure (CMake), passing the Homebrew compiler explicitly
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_C_COMPILER=gcc-$GCC_VERSION -DCMAKE_CXX_COMPILER=g++-$GCC_VERSION -DCMAKE_BUILD_TYPE=Release ..

      - name: Build KITEx + KITE-tools
        run: cmake --build build --config Release -j 4

      - name: Smoke test — generate a config and run KITEx
        run: |
          cd examples
          "$PYTHON_BIN" dos_graphene.py
          ../build/KITEx graphene_lattice-output.h5
